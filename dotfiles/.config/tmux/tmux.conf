# General cfg{{{

set -g base-index 1 #start window indexing at one instead of zero
set -g allow-rename off
set -g mouse on
set -g history-limit 10000
# set -as terminal-overrides ",alacritty*:Tc"
# set -as terminal-overrides ",xterm-kitty*:Tc"
# set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",alacritty,xterm-*,wezterm:Tc"

# set -as terminal-overrides ",xterm*:Tc"
set-option -g default-command zsh
# set-option -g renumber-windows on # Automatically renumber the windows of a session
# No delay for escape key press
set -sg escape-time 0
# Let terminal apps (e.g. neovim autoread) know when tmux gains/loses focus
set-option -g focus-events on
# fix cursor shape in neovim

# Claude Code support
# Let escape sequences pass through tmux untouched so Claude Code's desktop
# notifications and progress bar reach the outer terminal instead of being swallowed.
set -g allow-passthrough on
# Enable the extended (CSI u) key protocol so tmux can report modified keys.
set -s extended-keys on
# Advertise extended-key support so Shift+Enter is distinguishable from plain
# Enter (inserts a newline instead of submitting). The pattern matches the
# OUTER terminal's TERM name, so wezterm is listed explicitly (it reports
# TERM=wezterm here, see the terminal-overrides line above) alongside xterm*.
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'wezterm:extkeys'

# }}}


set -g set-clipboard on

# Key Bindings{{{

unbind '"'
unbind %
unbind C-b
unbind c

set-option -g prefix C-s # remap prefix from 'C-b' to 'C-s'
bind-key C-a send-prefix

bind-key C-c new-window

# navigating panes
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# split panes using | and -
bind | split-window -h
bind - split-window -v

bind-key C-s last-window
bind-key C-w swap-pane -s +
bind-key C-l swap-window -t -1
bind-key C-k choose-session -F '#{session_name}: #{session_windows}w  #(~/.config/tmux/scripts/claude-status.sh #{session_name})#{?session_attached, (attached),}'

bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# 🐦 Dodo command palette (prefix + o) — centered popup
bind o display-popup -E -w 70% -h 60% "~/.config/tmux/scripts/dodo-palette.sh"

# 🐦 Dodo agents — full-window view (prefix + a): centered popup launcher
bind a run-shell "~/.config/tmux/scripts/dodo-dashboard.sh"

# 🐦 Dodo agents — left sidebar view (prefix + e): toggle embedded left pane
bind e run-shell "~/.config/tmux/scripts/dodo-sidebar.sh --sidebar #{pane_id}"

# pane movement
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

# Organizing panes
# bind-key g command-prompt -p "place below. select target window" "move-pane -v -t %%"
bind g run-shell "tmux display-panes && tmux command-prompt -p 'place below. select target window' 'move-pane -v -t %%'"

# bind-key G command-prompt -p "place right of. select target window" "move-pane -h -t %%"
bind g run-shell "tmux display-panes && tmux command-prompt -p 'place right of. select target window' 'move-pane -h -t %%'"

unbind F2
# bind -n F2 new-window
# Window Navigation
bind-key N prev
bind-key n next

bind -n F3 prev
bind -n F4 next
# Split Windows
bind -n F5 split-window -v
bind -n F6 split-window -h
bind -n F7 copy-mode
bind -n F8 command-prompt 'rename-window %%'
bind -n F9 break-pane
bind -n F10 set-window-option synchronize-panes
bind -n F12 kill-pane
# Pane Navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D 

# ===============
# General Options
# ===============
# smart pane switching with awareness of vim splits
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# }}}

# Notifications{{{

set-option -g visual-activity on
set-option -g visual-bell on
set -g status-interval 2
# }}}

# Catppuccin tmux{{{
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
#}}}

# Tmux Plugin Manager{{{
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

run '~/.config/tmux/plugins/tpm/tpm'

#}}}

